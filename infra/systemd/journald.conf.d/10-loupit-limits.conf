# loupit — journald 보관 상한 (2026-07-30)
#
# 왜: 상한이 없어 2026-03-16 이후 4.5개월간 2.8G 로 무한 증가했다. 루트 파티션이
#     49G 뿐이라 방치하면 언젠가 디스크가 찬다.
# 왜 60일: 진단에 필요한 이력(백업·ops-digest·API 로그)을 넉넉히 덮으면서,
#     베타 console 모드가 journald 에 평문으로 남기는 인증코드·수신 이메일의
#     잔존 기간(NFR31)을 4.5개월 → 60일로 줄인다.
# 왜 드롭인: /etc/systemd/journald.conf 는 패키지 conffile 이라 직접 고치면
#     업그레이드 때 충돌 프롬프트가 뜬다. 드롭인은 충돌하지 않는다.
[Journal]
SystemMaxUse=1G
MaxRetentionSec=60d
