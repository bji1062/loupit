# /etc/tmpfiles.d/loupit.conf — 재부팅에도 살아남는 런타임 파일 선언.
#
# 테스트 DB 상호 배제 락. `loupit_test` 를 통째로 갈아엎는 두 주체가 이 파일을 flock 한다:
#   · 주간 복원 훈련  `infra/deploy/restore-drill.sh`      (systemd: User=ubuntu)
#   · pytest 세션     `server/tests/conftest.py`            (사람: ubuntu 또는 root)
#
# 🚨 **`/var/lock`(= `/run/lock`)에 두면 안 된다.** 2026-07-30 실측: 이 커널은
#    `fs.protected_regular = 2` 다. 그 설정은 **끈적(sticky)·전체쓰기 디렉터리에서 남이 소유한
#    정규 파일을 열지 못하게** 막는데, `/run/lock` 이 정확히 그런 디렉터리(1777)다.
#    → 훈련(ubuntu)이 만든 락을 **root 로 돌린 pytest 가 열지 못했다**(root 인데도 EACCES).
#    파일 모드를 0666 으로 줘도 소용없다 — 모드가 아니라 **소유자 불일치**가 걸린다.
#    그래서 끈적 디렉터리 밖에 전용 디렉터리를 판다. 거기서는 이 보호가 적용되지 않는다.
#
# ⓘ `/run` 은 tmpfs 라 재부팅하면 사라진다 — 그래서 선언이 필요하다(부팅 때 재생성).
d /run/loupit 0775 ubuntu ubuntu -
f /run/loupit/testdb.lock 0666 ubuntu ubuntu -
