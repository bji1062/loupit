# /etc/tmpfiles.d/loupit.conf — 재부팅에도 살아남는 런타임 파일 선언.
#
# 테스트 DB 상호 배제 락. `loupit_test` 를 통째로 갈아엎는 두 주체가 이 파일을 flock 한다:
#   · 주간 복원 훈련  `infra/deploy/restore-drill.sh`      (systemd: User=ubuntu)
#   · pytest 세션     `server/tests/conftest.py`            (사람: ubuntu 또는 root)
#
# ⚠ **모드 0666 이 핵심이다.** `/run/lock` 은 sticky(1777)라 누구나 파일을 만들 수 있는데,
#   먼저 만든 쪽의 소유·모드(보통 0644)가 그대로 남아 **다른 쪽이 열지 못한다**. 2026-07-30 에
#   실제로 그랬다 — root 로 돌린 훈련이 파일을 먼저 만들자 `User=ubuntu` 인 systemd 유닛이
#   `Permission denied` 로 죽었다. 락은 열려야 락이지, 못 열면 상호 배제가 아니라 장애다.
#   내용은 쓰지 않고 flock 만 하므로 0666 이어도 새는 정보가 없다.
#
# ⓘ `/run/lock` 은 tmpfs 라 재부팅하면 사라진다 — 그래서 선언이 필요하다(부팅 때 재생성).
f /run/lock/loupit-testdb.lock 0666 ubuntu ubuntu -
