# 관리 호스트(admin.jobcho.wiki) 보안·전송 헤더 — loupit-admin.conf 의 각 location 에서 include (SP-AUTH-19.8)
# add_header 는 하위 location 에 자체 add_header 가 있으면 상속되지 않으므로 include 로 주입한다
# (loupit-security.conf·loupit-beta-security.conf 와 같은 관례).
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
# 본 사이트보다 한 단계 엄격하다 — 관리 화면의 주소(경로·조회 조건)는 어디로도 흘리지 않는다.
add_header Referrer-Policy           "no-referrer" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
# 관리 화면은 색인 대상이 아니다. 비밀번호 뒤라 크롤러는 401 만 보지만, 401 응답에도 싣는다(always).
add_header X-Robots-Tag              "noindex, nofollow" always;
