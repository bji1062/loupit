# admin.jobcho.wiki — 운영 콘솔 관리 호스트 (SP-AUTH-19.8, 2026-09-18)
#
# 콘솔(/api/v1/console)은 원래 SSH 터널로만 열린다. 휴대폰에서도 보려고 이 vhost 를 **두 겹 잠금**으로 연다:
#   첫째 잠금 = nginx `auth_basic`(비밀번호) — server 레벨. 아래 모든 location 이 상속한다(ACME 만 예외).
#   둘째 잠금 = 앱의 이메일 코드 로그인 + 운영자 화이트리스트(`OPERATOR_EMAILS`). 운영자가 아니면 404.
# 그리고 그 둘을 잇는 고리가 게이트 헤더다: 비밀번호를 넘은 요청에만 이 vhost 가
# `X-Loupit-Admin-Gate: <비밀>` 을 붙이고(snippets/loupit-admin-gate.conf — 서버에만 있다), 앱은
# Host = ADMIN_HOST · 헤더 = ADMIN_GATE_SECRET 일 때만 콘솔 관문을 연다(deps.require_console_access).
# 본 사이트·베타 conf 는 같은 헤더를 빈 값으로 지우므로 그쪽으로는 비밀을 알아도 통과하지 못한다.
#
# 프록시하는 것은 **콘솔과 로그인에 필요한 경로뿐**이다. 정적 사이트·커뮤니티·공개 API 는 여기서 404 —
# 관리 호스트가 본 사이트의 두 번째 입구가 되지 않게 한다.
#
# 배치(수동 — release.sh 는 nginx conf 를 배포하지 않는다, 함정 ⑭):
#   절차 정본 = docs/handoff/2026-09-18-관리화면-admin-호스트.md (인증서 → htpasswd → 비밀 → 순서대로).
#   ⚠ 인증서가 생기기 전에는 이 파일 전체를 켤 수 없다(`ssl_certificate` 파일이 없으면 nginx -t 실패).
#     그래서 인증서 발급은 80 블록만 담은 임시 파일로 먼저 한다(절차 문서 1단계).
#   ⚠ sites-enabled 심링크 이름은 **`zz-loupit-admin.conf`** 로 둔다. nginx 는 sites-enabled/* 를
#     이름순으로 읽고, `default_server` 가 없으면 **처음 읽은 vhost 가 미매치 Host(공인 IP·loupit.co)의
#     폴백**이 된다. `loupit-admin.conf` 로 두면 알파벳순 첫째가 되어 폴백이 베타에서 이 vhost 로 바뀐다
#     (IP 스캐너가 관리 호스트 인증서와 비밀번호 창을 보게 된다). 지금의 폴백(베타)을 유지하려는 이름이다.
#   ⚠ 이 파일이 쓰는 존 `loupit_admin` 은 conf.d/loupit-limits.conf 에 있다 — 그 파일을 **먼저** 갱신한다.
#
# nginx 1.18 → `listen 443 ssl http2;` 형식(loupit.conf 와 동일).

# ── HTTP :80 — ACME challenge 통과 후 전량 HTTPS 301 ──
# 비밀번호를 걸지 않는다: 여기엔 리다이렉트와 ACME 챌린지뿐이라 보여 줄 것이 없다.
server {
    listen 80;
    listen [::]:80;
    server_name admin.jobcho.wiki;

    # certbot 의 webroot_path(/home/ubuntu/loupit/web — jobcho.wiki·beta 와 **공유**)와 같아야 자동갱신이 된다.
    location ^~ /.well-known/acme-challenge/ {
        root /home/ubuntu/loupit/web;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS :443 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.jobcho.wiki;

    ssl_certificate     /etc/letsencrypt/live/admin.jobcho.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.jobcho.wiki/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MozSSLadmin:1m;   # 쓰는 사람이 한 명이라 1m 로 충분(본 사이트 존과 분리)
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    charset utf-8;
    limit_req_status 429;

    # ── 첫째 잠금: 비밀번호 — **server 레벨**이라 아래 location 전부가 상속한다 ──
    # location 마다 걸면 새 블록 하나를 빠뜨리는 날 그 경로만 비밀번호 없이 열린다(콘솔 관문을 라우터
    # 레벨에 두는 것과 같은 이유). 예외는 ACME 챌린지 하나뿐이다(test_admin_host_gate 가 검사한다).
    # 파일은 서버에만 있다: /etc/nginx/loupit-admin.htpasswd (root:www-data 640).
    auth_basic           "jobcho console";
    auth_basic_user_file /etc/nginx/loupit-admin.htpasswd;

    # 비밀번호 추측 리밋 — limit_req(preaccess)는 auth_basic(access)보다 먼저 돌아 401 로 끝나는 요청도 센다.
    # location 에 limit_req 가 있으면 이 줄은 상속되지 않으므로 프록시 블록마다 같은 줄을 반복한다.
    limit_req zone=loupit_admin burst=20 nodelay;

    # 스크래핑 방어 Layer B(악성 봇 UA `if ($loupit_bad_bot) return 403`)는 **일부러 두지 않는다.** 서버 레벨
    # `return` 은 rewrite 단계라 비밀번호보다 먼저 나가 "이 UA 는 막는 호스트"를 알려 준다(적대 검토 L4 —
    # ACME 외 모든 응답은 비밀번호 뒤). 그리고 비밀번호 뒤에는 긁어 갈 공개 데이터가 없어 막을 이유도 없다 —
    # 봇이 보는 것은 어느 UA 든 401 뿐이고, 추측 시도는 위 loupit_admin 리밋이 센다.

    include /etc/nginx/snippets/loupit-admin-security.conf;

    # 443 으로 넘어온 ACME 요청(리다이렉트를 따라온 검증 등)만 비밀번호 예외. 챌린지 파일 외엔 없다.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /home/ubuntu/loupit/web;
        default_type "text/plain";
    }

    # ── 비밀번호 **뒤에서만** 답한다 — `return` 을 location·server 레벨에 바로 쓰지 않는 이유 ──
    # (예외: 비밀번호 전에 나갈 수밖에 없는 것 — ACME 챌린지(아래), :80 의 https 리다이렉트(평문에 비밀번호를
    #  보내게 할 수는 없다), limit_req 의 429(경로와 무관하게 똑같다). 셋 다 경로 구조를 드러내지 않는다.)
    # `return`·`if … return` 은 rewrite 단계라 auth_basic(access 단계)보다 **먼저** 나간다. 그러면 비밀번호
    # 없는 스캐너가 경로마다 다른 답(302·403·404 대 401)을 받아 이 호스트의 구조를 그린다(2026-09-18 적대
    # 검토). `try_files`(access 뒤 단계)로 한 번 돌려 보내면 비밀번호 없는 요청은 **어디서나 401** 이다.
    # 없는 파일 `/__loupit_none__` 은 그 단계를 지나게 하는 장치일 뿐이다(root 는 nginx 기본값 — 파일 없음).

    # 주소창에 호스트만 쳐도 콘솔로. 302(임시) — 301 은 브라우저가 영구 캐시해 나중에 바꾸기 어렵다.
    location = / {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        try_files /__loupit_none__ @to_console;
    }
    location @to_console {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        return 302 /api/v1/console;
    }

    # Layer A(X-Loupit-Client) 거부도 비밀번호 뒤로 미룬다 — 아래 블록들의 `if` 는 여기로 **내부 이동**만 한다.
    location = /__layer_a_denied {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        try_files /__loupit_none__ =403;
    }

    # ── 콘솔 껍데기(HTML) — `=` 정확 매칭, Layer A(X-Loupit-Client) **면제** ──
    # 주소창 이동이라 브라우저가 커스텀 헤더를 붙일 수 없다. 껍데기에는 데이터가 없고(운영자 API 가 준다),
    # 앱이 게이트 헤더·Host 를 따로 확인한다. 데이터 API(아래 ^~)는 헤더를 요구한다.
    location = /api/v1/console {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        limit_req zone=loupit_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/loupit-admin-gate.conf;
        proxy_set_header Authorization "";   # 비밀번호(Basic)는 앱에 넘기지 않는다 — 앱은 쓰지 않는다
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # ── 콘솔 데이터·조작 API ──
    # Layer A 는 본 사이트와 같다(`X-Loupit-Client` 없으면 403 — 단 비밀번호 검사 뒤에). 앱의 require_csrf 와 이중 방어다.
    location ^~ /api/v1/console/ {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        if ($http_x_loupit_client = "") { rewrite ^ /__layer_a_denied last; }   # 403 은 비밀번호 뒤에서
        limit_req zone=loupit_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/loupit-admin-gate.conf;
        proxy_set_header Authorization "";   # 비밀번호(Basic)는 앱에 넘기지 않는다 — 앱은 쓰지 않는다
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
        # 회원·게시판 한 페이지(최대 100행)가 기본 버퍼(32KB)를 넘을 수 있다. 넘으면 nginx 가 임시파일로
        # 흘리는데, 그 디렉터리 권한 문제로 응답이 조용히 잘린 실제 장애가 있었다(loupit.conf ^~ /api/v1/ 주석).
        proxy_buffers 16 64k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;
    }

    # ── 둘째 잠금의 입구: 이메일 코드 로그인 3종 ──
    # 세션 쿠키는 Domain 없는 host-only(Path=/api/v1)라, 여기서 받은 세션은 jobcho.wiki 와 **섞이지 않는다.**
    # 본 사이트와 같은 방어를 그대로 건다 — Layer A 헤더 게이트 + 리밋. 발송(login-code)은
    # **loupit_mail 공유 버킷**까지 소비해 관리 호스트가 메일 폭탄의 우회로가 되지 않게 한다.
    # CORS 는 바꾸지 않는다: 콘솔이 같은 오리진에서 부르므로 허용목록에 이 호스트를 넣을 이유가 없다.
    location = /api/v1/members/login-code {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        add_header Retry-After $loupit_retry_after always;   # 429 에만 부착(map: conf.d/loupit-limits.conf)
        if ($http_x_loupit_client = "") { rewrite ^ /__layer_a_denied last; }   # 403 은 비밀번호 뒤에서
        limit_req zone=loupit_admin burst=20 nodelay;
        limit_req zone=loupit_mail  burst=5  nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/loupit-admin-gate.conf;
        proxy_set_header Authorization "";   # 비밀번호(Basic)는 앱에 넘기지 않는다 — 앱은 쓰지 않는다
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    location = /api/v1/members/login {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        if ($http_x_loupit_client = "") { rewrite ^ /__layer_a_denied last; }   # 403 은 비밀번호 뒤에서
        limit_req zone=loupit_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/loupit-admin-gate.conf;
        proxy_set_header Authorization "";   # 비밀번호(Basic)는 앱에 넘기지 않는다 — 앱은 쓰지 않는다
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    location = /api/v1/members/logout {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        if ($http_x_loupit_client = "") { rewrite ^ /__layer_a_denied last; }   # 403 은 비밀번호 뒤에서
        limit_req zone=loupit_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/loupit-admin-gate.conf;
        proxy_set_header Authorization "";   # 비밀번호(Basic)는 앱에 넘기지 않는다 — 앱은 쓰지 않는다
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # 그 외 전부 404 — 정적 사이트·커뮤니티·공개 API 는 이 호스트의 일이 아니다(비밀번호 뒤에서, 위 머리말).
    location / {
        include /etc/nginx/snippets/loupit-admin-security.conf;
        try_files /__loupit_none__ =404;
    }
}
