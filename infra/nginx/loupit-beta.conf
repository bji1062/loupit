# beta.loupit.co — 무중단 스테이징 vhost. jobcho.wiki(라이브 jobchoice)와 완전 격리.
# - API 프록시 → 127.0.0.1:8001 (loupit-beta-api.service)
# - 정적 루트 = loupit 리포 web/ + web/dist (프로덕션 loupit.conf와 동일 산출물)
# - 스테이징 SEO 보호: X-Robots-Tag noindex(loupit-beta-security.conf) + robots.txt 전면 Disallow
# 배치: /etc/nginx/sites-available/loupit-beta.conf → sites-enabled 심링크.
# nginx 1.18 → `listen 443 ssl http2;` 형식(loupit.conf와 동일).
#
# ── docroot 드리프트 해소 완료 (2026-07-28) ─────────────────────────────────
# 이전엔 M9 프론트가 미병합 `m9-frontend` 브랜치에 있어 베타만 별도 체크아웃
# (`/home/ubuntu/loupit-fe/web`)을 서빙했고, 그래서 이 파일을 통째 복사하면 베타가 404 가 되는
# 함정이 있었다. **병합(`8060848`)으로 해소됐다** — 이제 베타도 main 트리(`/home/ubuntu/loupit/web`)를
# 서빙하므로 이 파일은 그대로 배치해도 된다(경로 치환 불필요).
#
# ⚠ 그래도 **`deploy-beta.sh` 로 배치하라**(직접 cp 금지). 그 스크립트는 (a) docroot 에 실제
#   페이지가 있는지 배치 **전에** 확인하고(`nginx -t` 는 root 존재를 검사하지 않는다),
#   (b) ACME root 가 certbot 의 `webroot_path` 와 일치하는지 검증한다(불일치 시 인증서
#   자동갱신이 90일간 조용히 실패한다 — 실제로 겪었다).
#
# ⚠ prod 와 정적 파일을 **공유**한다는 뜻이다: `web/*.html`·`web/assets/*` 변경은 두 사이트에
#   동시 반영된다. 프론트만 베타에서 선검증해야 하면 그때 임시 워크트리를 만들어라
#   (`git worktree add <경로> <브랜치>` → BETA_DOCROOT 로 지정 → 끝나면 제거).
#   M9 페이지의 prod 노출 통제는 파일 분리가 아니라 **`loupit.conf` 의 404 차단 블록**이 맡는다.

# ── HTTP :80 — ACME challenge 통과 후 전량 HTTPS 301 ──
server {
    listen 80;
    listen [::]:80;
    server_name beta.loupit.co;

    # ⚠ 이 root 는 **docroot 치환 대상이 아니다**(2026-07-27 세션 C 결함 수정).
    #   certbot 은 `webroot_path`(= /home/ubuntu/loupit/web, jobcho.wiki 와 **공유**)에 챌린지
    #   파일을 쓴다. deploy-beta.sh 의 일괄 치환이 이 줄까지 `/home/ubuntu/loupit-fe/web` 으로
    #   바꿔 놓아, certbot 이 쓰는 곳과 nginx 가 읽는 곳이 어긋나 **베타 인증서 자동갱신이 조용히
    #   실패**하고 있었다(실측: `certbot renew --dry-run` → beta 만 404 로 실패, jobcho.wiki 는 성공).
    #   ACME 챌린지는 앱 docroot 와 아무 상관이 없으므로 두 vhost 가 한 디렉터리를 공유하는 것이
    #   정상이고, 그래야 docroot 가 또 옮겨져도 갱신이 깨지지 않는다.
    #   → `ACME-NO-REWRITE` 마커가 있는 줄은 deploy-beta.sh 의 sed 가 건너뛴다. 지우지 마라.
    location ^~ /.well-known/acme-challenge/ {
        root /home/ubuntu/loupit/web;   # ACME-NO-REWRITE
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS :443 (beta) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.loupit.co;

    ssl_certificate     /etc/letsencrypt/live/beta.loupit.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.loupit.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MozSSLbeta:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/ubuntu/loupit/web;
    index index.html;
    charset utf-8;
    limit_req_status 429;           # 리밋 초과 응답코드. 미지정 시 nginx 기본은 503이라
                                    # 클라이언트가 "서버 장애"와 "리밋"을 구분하지 못한다(prod와 동일).

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/loupit-beta-security.conf;

    # 스테이징: 검색엔진 전면 차단(dist/robots.txt는 jobcho.wiki용 → 여기선 오버라이드)
    location = /robots.txt {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        # Content-Type은 return 200 + default_type(text/plain)로 nginx가 이미 부여 —
        # add_header Content-Type 를 두면 중복 헤더가 되므로 두지 않는다(L-3).
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 랜딩
    location = / {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # 비교 툴 SPA 셸
    # $is_args$args 필수 — prod loupit.conf 와 동일 이유(쿼리스트링 승계).
    location = /compare  { return 301 /compare/$is_args$args; }
    location = /compare/ {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /compare/index.html =404;
    }

    # 자산 v2 세대(2026-07-19 캐시버스팅) — 프로덕션 loupit.conf와 대칭. HTML·CSS·JS가
    # /assets/v2/…를 참조하므로 이 location이 없으면 beta 페이지의 자산이 전부 404가 된다.
    # 상세 근거·gzip_static off 사유는 loupit.conf 동일 블록 주석 참조.
    location ^~ /assets/v2/ {
        alias /home/ubuntu/loupit/web/assets/;
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "no-cache" always;
        gzip_static off;
    }

    # 구 자산 경로(무버전) 하위호환 — 2026-07-19부터 프로덕션도 동일한 no-cache 재검증을 쓴다
    # (stamp_assets.sh ?v= 스탬핑은 폐기됨). no-cache = 매 요청 조건부 검증 → 변경 없으면 304.
    location ~* \.(?:css|js|woff2|svg|png|jpg|webp|ico)$ {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ── L-2 canonical 중복 제거 ──
    # 문서루트가 web/ 라 web/dist 산출물이 /dist/... 로 그대로 200 노출된다.
    # (a) /dist/ 직접 노출 차단(^~ 라 정규식/일반 location 보다 우선; 내부 try_files·
    #     error_page redirect 는 /dist/ 로 시작하는 URI 를 만들지 않아 클린 라우트에 무해).
    location ^~ /dist/ { return 404; }
    #     이전 빌드 백업(web/dist.prev/)도 같은 이유로 노출된다 — 프로덕션 loupit.conf 와
    #     동일하게 차단한다(발견 low #12, 대칭). noindex 라 SEO 영향은 없으나 stale 이전
    #     빌드 사본이 스테이징에서 200 으로 열람되는 것을 막는다.
    location ^~ /dist.prev/ { return 404; }
    # (b) 직접 .html/.html.gz 접근은 아래 /company/·/vs/ 의 try_files 를 `$uri.html` 로만
    #     두어 차단한다: 클린 URL(/company/<slug>)은 $uri.html 로 해석돼 200, 이미 .html 이
    #     붙은 요청(/company/<slug>.html)은 <slug>.html.html 을 찾다 =404 로 떨어진다.

    # 생성물: 회사 상세 ~95
    location ^~ /company/ {
        root /home/ubuntu/loupit/web/dist;
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri.html =404;
    }

    # 생성물: 인기 조합
    location ^~ /vs/ {
        root /home/ubuntu/loupit/web/dist;
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri.html =404;
    }

    # 생성물: 회사 인덱스(2026-07-19 고아 페이지 해소 — 등록 회사 전량 링크 진입문) + 정책 4종
    location = /companies  { root /home/ubuntu/loupit/web/dist; include /etc/nginx/snippets/loupit-beta-security.conf; add_header Cache-Control "public, max-age=300" always; try_files /companies.html  =404; }
    location = /privacy    { root /home/ubuntu/loupit/web/dist; include /etc/nginx/snippets/loupit-beta-security.conf; add_header Cache-Control "public, max-age=300" always; try_files /privacy.html    =404; }
    location = /terms      { root /home/ubuntu/loupit/web/dist; include /etc/nginx/snippets/loupit-beta-security.conf; add_header Cache-Control "public, max-age=300" always; try_files /terms.html      =404; }
    location = /disclaimer { root /home/ubuntu/loupit/web/dist; include /etc/nginx/snippets/loupit-beta-security.conf; add_header Cache-Control "public, max-age=300" always; try_files /disclaimer.html =404; }
    location = /ads        { root /home/ubuntu/loupit/web/dist; include /etc/nginx/snippets/loupit-beta-security.conf; add_header Cache-Control "public, max-age=300" always; try_files /ads.html        =404; }

    # SEO 산출물(sitemap은 서빙하되 noindex 유지 — 검증용)
    location = /sitemap.xml { root /home/ubuntu/loupit/web/dist; include /etc/nginx/snippets/loupit-beta-security.conf; add_header Cache-Control "no-store" always; }

    # ── 메일 발송(SC14, SP-INFRA-3.4.2) — 일반 리밋 + 강한 메일 리밋 이중 적용 ──
    # 베타는 M9가 켜져 있어(prod는 OFF) **실제로 메일이 나가는 유일한 호스트**다.
    # 요청 1건 = SMTP 실전송이고, 앱 쿨다운은 이메일 해시 스코프라 주소를 바꾸면 안 걸린다
    # → IP 존이 유일한 실질 상한. `=` 매칭은 아래 `^~`의 proxy_* 를 상속하지 않아 명시 반복한다.
    # 프론트 apiSend(api.js)·login-test.html이 X-Loupit-Client를 붙이므로 정상 사용은 통과하고
    # 맨 curl 스팸 루프만 앱에 닿기 전에 403으로 끊긴다(앱 require_csrf 와 이중 방어).
    # burst=5 (2026-07-27 상향, 이전 2): login-code 는 **모든 사용자가 반드시 먼저 통과하는**
    # 온보딩 입구다 — 재직인증(verify-code)은 로그인을 거친 뒤에만 도달하는 후행 단계인데
    # 정작 입구를 더 조여 놨었다(NAT 완화 논리가 거꾸로 적용). 한국 이동통신 CGNAT 처럼 공유 IP
    # 규모가 큰 경로에서는 서로 무관한 사용자끼리 이 상한을 나눠 쓴다. burst=2 실측: 같은 IP 뒤
    # 8명이 3초 간격 요청 → 204/204/204/429/429/429/429/204 로 8명 중 4명이 21초간 차단됐다.
    # rate 3r/m 은 그대로라 지속 상한(스팸 루프 방어)은 전혀 약해지지 않고 순간 동시성만 완화된다.
    location = /api/v1/members/login-code {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        # 429 일 때만 `Retry-After: 20`(map 정의·근거: conf.d/loupit-limits.conf). prod 와 대칭 —
        # loupit_mail 은 prod·beta 공유 버킷이라 여기만 빠지면 같은 리밋에 안내가 갈린다.
        add_header Retry-After $loupit_retry_after always;
        if ($http_x_loupit_client = "") { return 403; }
        limit_req zone=loupit_api  burst=60 nodelay;
        limit_req zone=loupit_mail burst=5  nodelay;   # verify-code 와 동일 — loupit_mail 은 공유 버킷
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # 재직 인증 코드 발송 — burst=5. 회사 도메인 메일 구조상 요청이 회사 egress NAT 한 IP에
    # 집중된다(SP-INFRA-3.4.4 #1).
    # ⚠ 단 loupit_mail 은 login-code 와 **공유 버킷**이라(존 정의 주석 참조) 이 burst=5 가
    #   "동시 온보딩 5건을 항상 흡수한다"는 뜻은 아니다 — 사용자는 login-code 를 먼저 거치므로
    #   그 소비가 이월돼 실제 흡수량은 그보다 작다. 여기 burst 는 독립 배분이 아닌 큐 깊이 상한이다.
    location = /api/v1/employment/verify-code {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Retry-After $loupit_retry_after always;   # 429 에만 부착(위 login-code 주석 참조)
        if ($http_x_loupit_client = "") { return 403; }
        limit_req zone=loupit_api  burst=60 nodelay;
        limit_req zone=loupit_mail burst=5  nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # 라이브니스 프로브(Layer A 예외) — prod loupit.conf 의 동일 블록과 대칭(2026-07-27 신설).
    # 아래 ^~ 에 Layer A 게이트를 추가하면서 함께 넣어야 한다: health 는 별도 블록이 없으면 ^~ 로
    # 떨어져 **무헤더 헬스체크가 403** 이 되기 때문이다. 근거는 prod 와 동일 — 응답에 데이터가 없고
    # (`{"status":"ok"}` 15바이트) smoke.sh 가 헤더 없이 curl 로 친다(SM-3·SM-20 "health 무헤더 200").
    # smoke.sh 는 BASE 오버라이드 설계라 `BASE=https://beta.loupit.co` 로 베타에 겨눌 수 있고,
    # 그때 이 블록이 없으면 SM-3·SM-20 이 403 으로 깨진다. 스크래핑 가치가 0이라 예외 비용도 0.
    # (조사 결과 현재 베타 health 를 주기적으로 치는 것은 없다 — cron 없음, loupit-beta-api.service 에
    #  헬스체크 없음(Type=simple·Restart=always), deploy-beta.sh 도 health 를 호출하지 않는다.
    #  즉 지금 깨져도 조용하다 — 그래서 더더욱 선제로 넣는다.)
    # `=` 매칭이 `^~` 보다 우선하므로 아래 헤더 게이트를 타지 않는다. proxy_* 미상속 → 명시 반복.
    location = /api/v1/health {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        limit_req zone=loupit_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # ── 메일 배달 웹훅(SP-AUTH-16 · SP-INFRA-3.4.8, 2026-07-29) — prod 대칭 ──
    # ⚠ **수신 호스트는 prod 다**(Resend 웹훅 등록 URL = https://jobcho.wiki/...). 여기 블록은
    #   나중에 beta 로 시험하려 할 때 nginx 를 또 고쳐 **손으로 배치**해야 하는 상황을 미리
    #   없애려고 대칭으로 둔다(release.sh 는 conf 를 배포하지 않는다 — 함정 ⑭).
    #   실제 게이팅은 앱이 한다: `RESEND_WEBHOOK_SECRET` 이 없으면 라우터 미등록 → 404.
    # ⚠ Layer A 재선언 금지 · loupit_mail 사용 금지 — 근거는 prod conf 의 같은 블록 주석 참조.
    location = /api/v1/webhooks/resend {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        limit_req zone=loupit_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # ── API 프록시 → 베타 인스턴스(:8001) ──
    # 일반 리밋(loupit_api 300r/m)을 전 /api/v1/에 건다 — 2026-07-27 이전 베타에는 limit_req가
    # 하나도 없어 프로덕션보다 방어가 약했다(존은 conf.d/loupit-limits.conf 에 이미 정의됨).
    location ^~ /api/v1/ {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        # ── 스크래핑 방어 Layer A: prod 와 동일한 헤더 게이트(2026-07-27 신설) ──
        # 이전엔 beta 에만 이 게이트가 없었다. SPEC SP-INFRA-3.4.3 은 "메일 2종을 뺀 SC14 라우트
        # 10종은 기존 ^~ /api/v1/ 의 Layer A 가 헤더를 강제하므로 FR-113 CSRF 요구가 엣지에서
        # 충족된다"고 주장하는데, 그 10개 라우트는 **M9 가 켜진 beta 에만 실재**한다(prod 는
        # M9_ENABLED 부재로 404). 즉 명세가 주장한 엣지 방어가 정작 라우트가 있는 유일한 호스트에서
        # 0이었다 — 이 줄이 그 간극을 닫는다.
        # 프론트는 안전: web/assets/js/api.js 의 apiFetch(:22)·apiSend(:58) 둘 다
        # X-Loupit-Client:'web' 을 붙인다(GET 포함). health 는 위 = 블록으로 예외.
        # ⚠ 알려진 예외 1건: infra/beta-test/login-test.html 의 헬퍼는 `method !== 'GET'` 일 때만
        #   헤더를 붙여(:166), 그 페이지의 GET 3종(/members/me, /companies/{id}/benefits,
        #   /companies/{id}/edits)이 이 게이트에서 403 이 된다. 해당 파일 소유자가 헬퍼를 전 메서드
        #   부착으로 고쳐야 한다(그 파일은 이 변경의 범위 밖 — 라이브 반영 전 확인할 것).
        if ($http_x_loupit_client = "") { return 403; }
        limit_req zone=loupit_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # ── M9 로그인 기능 테스트 페이지(베타 전용) ──
    # web/ docroot 밖(infra/beta-test)을 서빙 → 프로덕션·공유 docroot 무접촉. noindex·no-store.
    location = /login-test {
        root /home/ubuntu/loupit/infra/beta-test;
        try_files /login-test.html =404;
        default_type text/html;
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── M9 프론트 클린 URL(베타 전용) ──
    # 2026-07-27 역이식: 이 5블록은 라이브(/etc/nginx/sites-available/loupit-beta.conf)에만
    # 있고 리포엔 없었다. 이 파일을 라이브로 통째 복사하면 베타 로그인 화면이 전부 404가 되는
    # 드리프트였다(레이트리밋 배선 중 발견). prod 는 이 블록이 없어 클린 URL 이 404다 —
    # M9 프론트 공개는 prod conf 에 동일 블록을 추가하는 별도 결정이다.
    location = /login  { include /etc/nginx/snippets/loupit-beta-security.conf; try_files /login.html  =404; }
    location = /mypage { include /etc/nginx/snippets/loupit-beta-security.conf; try_files /mypage.html =404; }
    location = /verify { include /etc/nginx/snippets/loupit-beta-security.conf; try_files /verify.html =404; }
    location = /edit   { include /etc/nginx/snippets/loupit-beta-security.conf; try_files /edit.html   =404; }
    location = /edits  { include /etc/nginx/snippets/loupit-beta-security.conf; try_files /edits.html  =404; }

    # ── SC15 커뮤니티 (2026-08-27, SP-COMM-9) — 셸 1개(web/community/index.html) + JS pathname 라우터 ──
    # /community/{id} · /write · /{id}/edit 전부 같은 셸로 폴백한다. 자산(/assets/v2/)·API(/api/v1/)는
    # 위 ^~ 블록이 먼저 잡는다. `=` 리다이렉트는 compare 와 같은 이유($is_args$args). no-cache 는
    # 셸이 라이브 소스 직서빙이라서(랜딩과 동일). release.sh 는 conf 를 배포하지 않는다(함정 ⑭) — 수동 배치.
    location = /community { return 301 /community/$is_args$args; }
    location ^~ /community/ {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /community/index.html;
    }

    # 그 외 경로 → 정적 404
    location / {
        include /etc/nginx/snippets/loupit-beta-security.conf;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        root /home/ubuntu/loupit/web/dist;
        include /etc/nginx/snippets/loupit-beta-security.conf;
        add_header Cache-Control "no-store" always;
        internal;
    }
}
