# CI — 전 계층 자동 검사 (2026-08-26 도입)
#
# 로컬 게이트 run_tests.sh 는 여기서 쓰지 않는다: 그 스크립트는 배포 호스트 전용으로
# server/.env 를 파일로 읽고 서빙 데이터 백업/재주입을 수행한다. CI 는 격리 스키마
# (loupit_ci)라 그 장치가 전부 불필요하다. 커맨드는 HANDOFF-2026-07-31 §5 의
# "확인 목적이면 게이트 대신 이 4줄" 을 그대로 job 화한 것이다.
#
# 스키마·시드 준비 단계가 없는 이유: server/tests/conftest.py 의 schema_db /
# seeded_db 픽스처가 db/schema.sql 적용과 load.main(fresh=True) 시드를 직접
# 수행한다. MySQL 서비스에는 빈 loupit_ci 스키마 하나만 있으면 된다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 프론트 697 — DB·서버 불필요 (node --test 의 글롭 패턴은 Node 21+ 필요 → 22 고정)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node --test 'web/**/*.test.js'

  # 생성기 230 — fake 번들이라 DB 불필요. 단 generator.build → generator.bundle 이
  # server.config 를 임포트하므로 server 의존(pydantic-settings 포함)도 설치해야 한다.
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r generator/requirements.txt -r server/requirements.txt
      - run: python -m pytest generator/tests -q
      # ── env 독립성 가드 (2026-08-27) ──────────────────────────────────────
      # 위 실행은 env 가 **비어 있는** 러너 상태만 검증한다. 배포 호스트는 server.env 로
      # POLICY_CONTACT·SITE_ORIGIN 등을 주입하므로 조건이 다르다 — 그 차이 때문에
      # test_pc12_* 가 CI 에서만 초록이고 릴리스 게이트에서 빨갰다(함정 0079).
      # 같은 스위트를 **운영과 같은 모양의 env 를 주입해** 한 번 더 돌려, 특정 리터럴에
      # 결합된 단정이 다시 들어오면 여기서 잡는다. 값은 실운영값일 필요가 없다 —
      # "기본값과 다르다"는 사실만으로 결합을 드러낸다.
      - name: generator (운영 env 주입 — 배포 호스트 조건 재현)
        env:
          POLICY_CONTACT: ci-injected@example.com
          POLICY_LAST_MODIFIED: '2026-01-02'
          SITE_ORIGIN: https://ci.example.com
        run: python -m pytest generator/tests -q
      # 문서 정합 가드 — TASK 롤업이 리프 마커 실측과 일치하는지 (드리프트 즉시 검출)
      - run: python docs/tools/task_progress.py --check

  # 백엔드 540 — 일회용 mysql:8.0 서비스 컨테이너. DB_NAME=loupit_ci 는 서빙 이름
  # (LOUPIT/loupit)이 아니므로 schema_guard 가 플래그 없이 허용한다. flock
  # (/run/loupit/testdb.lock)은 CI 에 디렉터리가 없어 경고 후 무시된다(설계된 폴백).
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: loupit_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci
      DB_NAME: loupit_ci
      LOUPIT_ALLOW_FRESH: '1'   # seeded_db 픽스처의 load.main(fresh=True) 파괴 가드 통과(#14)
      M9_ENABLED: '1'           # conftest 도 setdefault 하지만 명시
      MAILER_MODE: console      # 실메일 발송 차단
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r server/requirements.txt
      - run: python -m pytest server/tests -q -m "not sc14"
