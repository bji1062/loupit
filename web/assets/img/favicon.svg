<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="jobcho.wiki">
  <!-- favicon.svg — 탭 아이콘(주). logo.svg(잎 5장 + 베이스라인 스우시)를 **16px 에서 읽히도록**
       줄인 것이다: 잎 3장, 스우시 제거, 진초록 타일 배경으로 대비 확보.
       ⚠ 로고를 그대로 축소하면 안 된다 — 잎 5장은 16px 에서 초록 얼룩이 되고, 1px 스우시는
       사라지거나 지저분한 선으로 남는다. 파비콘은 축소가 아니라 **다시 그리는 것**이다.
       ⚠ 배경을 투명으로 두면 다크 탭바에서 잎이 묻힌다 → 타일로 채운다. -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3ef93"/>
      <stop offset="1" stop-color="#8bc34a"/>
    </linearGradient>
    <linearGradient id="leafSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe273"/>
      <stop offset="1" stop-color="#7ab63f"/>
    </linearGradient>
  </defs>
  <!-- 브랜드 진초록 타일(--brand #2f7d43) -->
  <rect width="32" height="32" rx="7" fill="#2f7d43"/>
  <!-- 잎 3장: 가운데가 가장 크고 양옆이 바깥으로 기운다(로고와 같은 어법) -->
  <!-- ⚠ 이 수치는 `infra/tools/make_favicon.py` 의 LEAVES 와 **같아야 한다**(래스터 산출물의
       근거). 한쪽만 고치면 SVG 를 쓰는 브라우저와 .ico 를 쓰는 브라우저가 다른 그림을 본다. -->
  <ellipse cx="9.2"  cy="18.6" rx="2.9" ry="7.4" fill="url(#leafSide)" transform="rotate(-24 9.2 18.6)"/>
  <ellipse cx="22.8" cy="18.6" rx="2.9" ry="7.4" fill="url(#leafSide)" transform="rotate(24 22.8 18.6)"/>
  <ellipse cx="16"   cy="15.2" rx="3.6" ry="9.6" fill="url(#leaf)"/>
</svg>
