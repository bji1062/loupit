<!doctype html>
<!-- staging/community/index.html — SC15 커뮤니티 셸(SP-COMM-8). 공개 시 `git mv staging/community web/community`
     (T-14.7.3, nginx `location ^~ /community/ { try_files $uri /community/index.html; }` 와 함께).
     셸은 **하나**다: community.js 가 location.pathname 으로 목록·상세·작성·수정 4화면을 가른다
     (web/index.html + app.js 와 같은 SPA 셸 패턴). h1·lede 는 정적이라 JS 없이도 읽힌다.
     본문은 JS 렌더라 1차는 색인을 기대하지 않는다 — robots 는 허용하되 noindex 도 붙이지 않는다(PLAN §3-2).
     `data-page-type` 미선언 = 광고 0(SP-ADS: 유형이 없으면 ads.js 가 슬롯을 마운트하지 않는다). -->
<html lang="ko">

<body>
<header data-global class="gnb"> <!-- web/index.html 의 초록 gnb 와 같은 마크업. 로그인 진입점은 authnav.js 가 채운다 -->
  <a class="skip-link" href="#main-heading">본문 바로가기</a>
  <nav aria-label="주요 링크">
    <a href="/" class="brand"><img class="brand-logo" src="/assets/v2/img/logo.svg" alt="" width="34" height="22">jobcho<span class="brand-dot">.</span>wiki</a>
    <!-- 상단 탭: 공개 시 generator/content/nav.py::GNB_TABS 와 test_gnb_tabs 로 동기화(커뮤니티 탭은 그 PR 에서 정본에 추가).
         순서·라벨을 임의로 바꾸지 마라. '비교 조합'은 랜딩의 레일 앵커라 여기서는 절대 경로(/#trending)로 건다 -->
    <a href="/" class="gnb-link">홈</a>
    <a href="/community/" class="gnb-link" aria-current="page">커뮤니티</a>
    <a href="/companies" class="gnb-link">회사정보</a>
    <a href="/#trending" class="gnb-link">비교 조합</a>
    <!-- 헤더 검색 폼은 두지 않는다(2026-08-27 결정): 랜딩의 `.gnb-search` 는 ui.js bindHeaderSearch 가
         REF(전체 회사 참조)를 가진 SPA 안에서만 동작하고, 홈은 `?q=` 를 읽지 않는다(app.js 는 `?a=`·`?b=` 만).
         입력을 받고 버리는 폼은 죽은 UI 다 — 로그인 계열 셸·생성 헤더와 같이 탭 + 로그인 진입점만 둔다. -->
    <!-- 로그인 진입점 슬롯(SC14). 기본 hidden — authnav.js 가 /members/me 프로브로 채운다.
         ⚠ 이 마크업은 web/index.html · generator/templates/partials/_authnav.html 과 **바이트 동일**이어야 한다. -->
    <a class="authnav" data-authnav hidden href="/login">
      <svg class="authnav-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2.5c-4.4 0-8 2.2-8 4.9V22h16v-2.6c0-2.7-3.6-4.9-8-4.9Z"/></svg>
      <span data-authnav-label>로그인</span>
    </a>
  </nav>
</header>

<main id="community">

  </noscript>
</main>

<script type="module" src="/assets/v2/js/community.js" defer></script>
