{# base.html — 전 페이지 상속 골격(SP-GEN-4.2). <html lang="ko">·head 필수요소·
   랜드마크(header/nav/main/footer, NFR13)·본문은 JS 없이 완성(NFR12·24) —
   <script>는 광고/enhancement 전용이며 본문 표시·CTA를 막지 않는다. #}
<!doctype html>
<html lang="{{ cfg.lang }}">
<head>
{% block head %}
{% include "partials/_head_meta.html" %}
{% block jsonld %}{% endblock %}
{% block css_extra %}{% endblock %}
{% endblock %}
</head>
{#- page_type: 자식 템플릿이 최상위 {% set page_type = '...' %}로 선언(SP-ADS-3.2 게이팅 값:
    company/combo/policy). 미선언(404 등) → 속성 미방출 = ads.js 'default'(무광고). -#}
<body{% if page_type is defined and page_type %} data-page-type="{{ page_type }}"{% endif %}>
{#- 수기 셸과 같은 초록 GNB(2026-09-01 통일). `data-global` 이 CSS 분기의 키다 —
    이 속성이 빠지면 `header:not([data-global])` 쪽 규칙이 걸려 옛 텍스트 헤더 레이아웃으로 돌아간다. -#}
<header data-global class="gnb">
{% include "partials/_header.html" %}
</header>
{#- skip-link(`#main-heading`) 대상. 수기 셸은 h1 에 이 id 를 달지만 생성 템플릿은 h1 이 6곳에
    흩어져 있어 랜드마크에 단다 — 앵커 문자열이 같으므로 동작은 동일하고, `tabindex="-1"` 덕에
    스크롤만이 아니라 포커스까지 실제로 옮겨간다(WCAG 2.4.1). -#}
<main id="main-heading" tabindex="-1">
{% block main %}{% endblock %}
</main>
<footer>
{% include "partials/_footer.html" %}
</footer>
{# SP-ADS-9 정적 배선. 본문 표시·색인은 JS 없이 완성(NFR24)이며 이 스크립트는 enhancement 전용.
   ⚠ **동의 배너는 2026-08-28 제거**했다(SP-ADS-7). 광고는 항상 **비개인화**로 요청하므로 물을 것이
   없고, 개인화 거부는 처리방침·광고고지의 외부 옵트아웃 링크가 담당한다. AdSense 승인 후 EEA/영국
   트래픽에 개인화 광고를 켜려면 자체 배너가 아니라 **구글 인증 CMP**(AdSense 개인정보 보호 및 메시지)를
   써야 한다 — 자체 UI 는 TCF 신호를 만들지 못한다. #}
<script type="module" src="/assets/v2/js/static-ads.js" defer></script>
{# 로그인 진입점(SC14). defer 모듈이라 본문 렌더를 막지 않고, 슬롯이 없거나 M9 가 꺼진 것이
   세션에 캐시돼 있으면 네트워크도 타지 않는다. 상세는 web/assets/js/authnav.js 주석. #}
<script type="module" src="/assets/v2/js/authnav.js" defer></script>
</body>
</html>
